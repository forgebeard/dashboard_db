[project]
name = "ovirt-analyzer"
version = "0.1.0"
description = "Дашборд диагностики дампов PostgreSQL oVirt Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.58.0",
    "pandas==3.0.3",
    "SQLAlchemy==2.0.51",
    "psycopg2-binary==2.9.12",
    "python-dotenv==1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.uv]
package = false
