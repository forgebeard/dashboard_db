name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check
      - name: Pytest (unit)
        run: pytest -m "not integration" --cov=src --cov-report=term-missing
      - name: Pytest coverage (sql_guard, statuses, inspectors)
        run: >
          pytest -m "not integration"
          --cov=core.sql_guard
          --cov=core.constants
          --cov=core.inspector_base
          --cov=hosts.host_inspector_sql
          --cov=vms.vm_inspector_sql
          --cov=snapshots.snapshot_inspector_sql
          --cov=clusters.cluster_inspector_sql
          --cov=disks.disks_inspector_sql
          --cov=networks.network_inspector_sql
          --cov=storage.storage_inspector_sql
          --cov=gluster.gluster_inspector_sql
          --cov-fail-under=60
          --cov-report=term

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -t ovirt-analyzer:ci .
