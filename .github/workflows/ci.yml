name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Check requirements export matches lock
        run: |
          uv export --frozen --no-dev --no-hashes -o /tmp/requirements.txt
          uv export --frozen --no-hashes -o /tmp/requirements-dev.txt
          diff -u -I '^#' requirements.txt /tmp/requirements.txt
          diff -u -I '^#' requirements-dev.txt /tmp/requirements-dev.txt
      - name: Install dev dependencies
        run: uv sync --frozen --group dev
      - name: Ruff
        run: uv run ruff check
      - name: Pytest (unit)
        run: uv run pytest -m "not integration" --cov=src --cov-report=term-missing --cov-fail-under=59

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -t red-virt-analytics:ci .
