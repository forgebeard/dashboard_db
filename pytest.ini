[pytest]
# Регистрация кастомных маркеров
markers =
    integration: Тесты, требующие подключения к реальной БД (запускать с -m integration)
    unit: Быстрые юнит-тесты с моками

# Пути для поиска модулей (чтобы импорты вида 'from core...' работали без sys.path)
pythonpath = src

# Минимальный вывод при успехе, подробный при ошибке
addopts = -v --tb=short

# Игнорирование предупреждений Streamlit о runtime (опционально, для чистоты логов)
filterwarnings =
    ignore::DeprecationWarning
    ignore:.*No runtime found.*:UserWarning
    ignore:.*missing ScriptRunContext.*:UserWarning